# 検査内容の定義は package.json の scripts に集約し、ここでは「いつ・何に対して走らせるか」だけを決める
# lefthook は名前順にコマンドを実行するため、先頭の数字で「整形 → Lint」の順序を固定する
pre-commit:
  commands:
    1_format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css}"
      run: pnpm run --silent format {staged_files}
      stage_fixed: true
    2_lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: pnpm run --silent lint:fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm run --silent commitlint

pre-push:
  commands:
    1_typecheck:
      # tsc はファイルを引数で渡すと tsconfig.json を無視するため、対象を渡さない
      run: pnpm run --silent typecheck
    2_lint_fsd:
      # FSD の構造は変更ファイル単体では判定できないため、フォルダ全体を渡す
      # 作業途中の未完成な構造で止めないよう pre-commit ではなくここに置く
      run: pnpm run --silent lint:fsd
    3_test:
      # 対象は vite.config.ts の include が決めるため、ここでは渡さない
      # 赤いテストを先に書く進め方を止めないよう pre-commit ではなくここに置く
      run: pnpm run --silent test
